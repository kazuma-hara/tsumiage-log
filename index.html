<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>積み上げログ</title><style>
:root{font-family:system-ui,"Noto Sans JP",sans-serif;color:#203044;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}header{background:#fff;padding:18px 5%;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{font-size:23px;margin:0}h2{font-size:19px;margin:0 0 14px}main{max-width:1100px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:white;border-radius:16px;box-shadow:0 3px 18px #182c4410;padding:20px;min-width:0}.wide{grid-column:1/-1}input,textarea,select,button{font:inherit}input,textarea,select{border:1px solid #cbd4df;border-radius:8px;padding:10px;max-width:100%}input[type=date]{width:170px}input[type=number]{width:82px}input[type=text]{width:100%}textarea{width:100%;min-height:110px;resize:vertical}button{background:#225cbb;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}button.secondary{background:#e8edf5;color:#27405c}button.danger{background:#f9e3e3;color:#953c3c}.flex{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row{padding:10px 0;border-bottom:1px solid #edf0f4;display:flex;align-items:center;gap:10px;justify-content:space-between}.row label{flex:1;word-break:break-word}.muted{font-size:13px;color:#64748b}.bar{background:#e6edf5;height:9px;border-radius:12px;overflow:hidden;margin:7px 0}.fill{height:100%;background:#3680cf}.metric{display:grid;grid-template-columns:1fr 82px;align-items:center;gap:12px;margin:8px 0}.chip{font-size:12px;background:#edf4ff;color:#26549a;padding:4px 8px;border-radius:30px}.chart{display:flex;align-items:end;gap:10px;height:130px;border-bottom:1px solid #b8c7d6}.chart>div{flex:1;text-align:center;font-size:11px}.chart i{display:block;background:#3e83d1;min-height:1px;border-radius:4px 4px 0 0}.stat{font-size:30px;font-weight:700}.hint{margin-top:12px;font-size:12px;color:#64748b}@media(max-width:700px){main{display:block;margin-top:12px}.card{margin-bottom:14px;padding:17px}header{padding:15px}h1{font-size:20px}} 
</style></head><body><header><div><h1>積み上げログ</h1><div class="muted">TODO × 長期目標 × 日記</div></div><div class="flex"><input id="day" type="date"><button id="backup" class="secondary">バックアップ</button><label class="chip" style="cursor:pointer">復元<input type="file" id="restore" accept=".json,application/json" hidden></label></div></header>
<main><section class="card"><h2>今日のTODO</h2><div class="flex"><input id="task" type="text" placeholder="やることを入力"><select id="goalSelect"><option value="">目標なし</option></select><button id="addTask">追加</button></div><div id="taskList"></div><div class="muted" id="taskStatus"></div></section>
<section class="card"><h2>長期目標</h2><div class="flex"><input id="goalName" type="text" placeholder="例：応用情報の勉強"><input id="goalCount" type="number" min="1" value="30" title="達成予定のTODO件数"><button id="addGoal">追加</button></div><div class="muted">進捗は、関連TODOの完了件数 ÷ 目標件数</div><div id="goalList"></div></section>
<section class="card"><h2>日記・振り返り</h2><div class="muted">今日の記録</div><textarea id="diary" placeholder="できたこと、気づいたこと、反省、明日へのメモなど"></textarea><div class="muted">入力内容は自動保存されます。</div></section>
<section class="card"><h2>10項目スコア</h2><div class="muted">各項目を1〜10点で評価（未入力も可）</div><div id="metrics"></div><div id="average" class="stat">—</div><div class="muted">当日の平均点</div></section>
<section class="card wide"><h2>最近7日間のTODO達成率</h2><div id="chart" class="chart"></div><p class="hint">※この版ではデータは端末ごとのブラウザに保存されます。スマホ・PC間の同期は未対応です。共有端末での利用は避け、定期的にバックアップしてください。</p></section></main>
<script>
const KEY='tsumiage_data_v4', names=['体調','気分','仕事タスク','没頭度','コミュニケーション','説明','仕事満足度','生活タスク','生活イベント','生活満足度'];
const $=id=>document.getElementById(id);const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
let data;try{data=JSON.parse(localStorage.getItem(KEY))||{}}catch{data={}};data.tasks??=[];data.goals??=[];data.days??={};
const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
$('day').value=iso(new Date());const today=()=>$('day').value;const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const text=(tag,s)=>{let el=document.createElement(tag);el.textContent=s;return el};
function redraw(){
const date=today();const tasks=data.tasks.filter(t=>t.date===date),done=tasks.filter(t=>t.done).length;
$('taskStatus').textContent=tasks.length?done+'/'+tasks.length+' 件完了（'+Math.round(done/tasks.length*100)+'%）':'まだTODOがありません';
$('goalSelect').replaceChildren(new Option('目標なし',''));data.goals.forEach(g=>$('goalSelect').add(new Option(g.name,g.id)));
$('taskList').replaceChildren();tasks.forEach(t=>{let row=text('div','');row.className='row';let cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;cb.onchange=()=>{t.done=cb.checked;save();redraw()};let label=text('label',t.name);if(t.done)label.style.textDecoration='line-through';let g=data.goals.find(x=>x.id===t.goalId);if(g)label.append(text('span',' ['+g.name+']'));let del=text('button','削除');del.className='danger';del.onclick=()=>{data.tasks=data.tasks.filter(x=>x.id!==t.id);save();redraw()};row.append(cb,label,del);$('taskList').append(row)});
$('goalList').replaceChildren();data.goals.forEach(g=>{let completed=data.tasks.filter(t=>t.goalId===g.id&&t.done).length;let pct=Math.min(100,completed/g.target*100);let wrap=document.createElement('div');wrap.style.marginTop='16px';let line=text('div','');line.className='flex';line.style.justifyContent='space-between';line.append(text('strong',g.name),text('span',completed+' / '+g.target+'件'));let del=text('button','削除');del.className='danger';del.onclick=()=>{if(confirm('目標を削除しますか？（TODOは残ります）')){data.goals=data.goals.filter(x=>x.id!==g.id);save();redraw()}};line.append(del);let bar=text('div','');bar.className='bar';let fill=text('div','');fill.className='fill';fill.style.width=pct+'%';bar.append(fill);wrap.append(line,bar);$('goalList').append(wrap)});
let entry=data.days[date]||{};$('diary').value=entry.diary||'';$('metrics').replaceChildren();names.forEach((name,i)=>{let row=text('label','');row.className='metric';row.append(text('span',name));let sel=document.createElement('select');sel.add(new Option('未入力',''));for(let n=1;n<=10;n++)sel.add(new Option(n+'点',n));sel.value=entry.scores?.[i]??'';sel.onchange=()=>{let e=data.days[date]??={};e.scores??={};if(sel.value)e.scores[i]=Number(sel.value);else delete e.scores[i];save();average()};row.append(sel);$('metrics').append(row)});
average();drawChart();
}
function average(){let e=data.days[today()]||{},v=Object.values(e.scores||{}).filter(n=>Number.isFinite(n));$('average').textContent=v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1)+' / 10':'—'}
function drawChart(){$('chart').replaceChildren();for(let i=6;i>=0;i--){let d=new Date(today()+'T12:00:00');d.setDate(d.getDate()-i);let day=iso(d),t=data.tasks.filter(x=>x.date===day),pct=t.length?Math.round(t.filter(x=>x.done).length/t.length*100):0;let bar=text('div','');let label=text('div',day.slice(5));let percent=text('div',t.length?pct+'%':'—');let line=text('i','');line.style.height=(pct*0.9)+'px';bar.append(percent,line,label);$('chart').append(bar)}}
$('day').onchange=redraw;$('diary').oninput=()=>{(data.days[today()]??={}).diary=$('diary').value;save()};
$('addTask').onclick=()=>{let name=$('task').value.trim();if(!name)return;data.tasks.push({id:uid(),date:today(),name,done:false,goalId:$('goalSelect').value});$('task').value='';save();redraw()};
$('addGoal').onclick=()=>{let name=$('goalName').value.trim(),target=Number($('goalCount').value);if(!name||!Number.isInteger(target)||target<1)return;data.goals.push({id:uid(),name,target});$('goalName').value='';save();redraw()};
$('backup').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tsumiage-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('restore').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!Array.isArray(obj.tasks)||!Array.isArray(obj.goals)||typeof obj.days!=='object'||!obj.days)throw Error('形式が違います');if(confirm('現在のデータをバックアップデータで上書きしますか？')){data=obj;save();redraw()}}catch(err){alert('復元失敗: '+err.message)}e.target.value=''};
redraw();
</script></body></html>
