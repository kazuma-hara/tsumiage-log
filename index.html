<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>積み上げログ</title><style>
:root{font-family:system-ui,"Noto Sans JP",sans-serif;color:#203044;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}header{background:#fff;padding:18px 5%;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{font-size:23px;margin:0}h2{font-size:19px;margin:0 0 14px}main{max-width:1100px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:white;border-radius:16px;box-shadow:0 3px 18px #182c4410;padding:20px;min-width:0}.wide{grid-column:1/-1}input,textarea,select,button{font:inherit}input,textarea,select{border:1px solid #cbd4df;border-radius:8px;padding:10px;max-width:100%}input[type=date]{width:170px}input[type=number]{width:82px}input[type=text]{width:100%}textarea{width:100%;min-height:110px;resize:vertical}button{background:#225cbb;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}button.secondary{background:#e8edf5;color:#27405c}button.danger{background:#f9e3e3;color:#953c3c}.flex{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row{padding:10px 0;border-bottom:1px solid #edf0f4;display:flex;align-items:center;gap:10px;justify-content:space-between}.row label{flex:1;word-break:break-word}.muted{font-size:13px;color:#64748b}.bar{background:#e6edf5;height:9px;border-radius:12px;overflow:hidden;margin:7px 0}.fill{height:100%;background:#3680cf}.metric{display:grid;grid-template-columns:1fr 82px;align-items:center;gap:12px;margin:8px 0}.chip{font-size:12px;background:#edf4ff;color:#26549a;padding:4px 8px;border-radius:30px}.chart{display:flex;align-items:end;gap:10px;height:130px;border-bottom:1px solid #b8c7d6}.chart>div{flex:1;text-align:center;font-size:11px}.chart i{display:block;background:#3e83d1;min-height:1px;border-radius:4px 4px 0 0}.stat{font-size:30px;font-weight:700}.hint{margin-top:12px;font-size:12px;color:#64748b}@media(max-width:700px){main{display:block;margin-top:12px}.card{margin-bottom:14px;padd </style></head><body><header><div><h1>積み上げログ</h1><div class="muted">TODO × 長期目標 × 日記</div></div><div class="flex"><button id="prevDay" class="secondary" aria-label="前日" title="前日">←</button><input id="day" type="date" aria-label="日付"><button id="nextDay" class="secondary" aria-label="翌日" title="翌日">→</button></div></header>
<main><section class="card wide"><h2>今日の概要</h2><div class="flex"><span>総合スコア：</span><strong id="overviewScore">—</strong><span class="muted" id="overviewProgress"></span></div></section><section class="card wide"><h2>1日のスケジュール</h2><div class="muted">今日したことや予定を時間帯でメモ。日付を切り替えるとその日の記録を表示します。</div><div class="flex" style="margin:12px 0"><input type="time" id="eventStart" value="09:00" aria-label="開始時刻"><input type="time" id="eventEnd" value="10:00" aria-label="終了時刻"><input type="text" id="eventText" placeholder="例：勉強・食事・散歩" style="flex:1;min-width:160px"><button id="addEvent">追加</button></div><div id="eventList"></div></section><section class="card"><h2>総合・7項目スコア</h2><div class="muted">各項目を1〜10点で評価（未入力も可）</div><div class="metric"><strong>総合（自動計算）</strong><output id="average" class="stat" style="font-size:20px;text-align:center;background:#e8edf5;padding:8px;border-radius:8px">—</output></div><div id="metrics"></div></section><section class="card"><h2>日記・振り返り</h2><div class="muted">今日の記録</div><textarea id="diary" placeholder="できたこと、気づいたこと、反省、明日へのメモなど"></textarea><div class="muted">入力内容は自動保存されます。</div></section><section class="card wide"><h2>最近7日間の振り返り</h2><div class="flex" style="margin-bottom:12px"><label for="chartMode">表示する項目</label><select id="chartMode"><option value="all">総合平均</option><option value="health">体調・気分・睡眠</option><option value="work">ワーク</option><option value="life">生活・習慣</option></select><select id="chartItem" aria-label="個別項目"><option value="">グループ平均</option></select></div><div id="chart" class="chart" style="height:auto;min-height:190px;display:block;border:0"></div><p class="hint">同期状況は上部で確認できます。別端末での変更は「クラウドから再取得」を利用してください。</p></section><section class="card"><h2>長期目標</h2><div class="flex"><input id="goalName" type="text" placeholder="例：応用情報の勉強"><button id="addGoal">追加</button></div><div class="muted">進捗は0〜100％を直接入力。いつでも編集できます（TODOとは独立）。</div><div id="goalList"></div></section><section class="card"><h2>今日のTODO</h2><div class="flex"><input id="task" type="text" placeholder="やることを入力"><button id="addTask">追加</button></div><div id="taskList"></div><div class="muted" id="taskStatus"></div></section></main><footer style="max-width:1100px;margin:20px auto 40px;padding:0 16px;text-align:right"><details><summary style="cursor:pointer;color:#64748b;font-size:13px">データ管理（バックアップ・復元）</summary><div class="flex" style="justify-content:flex-end;margin-top:12px"><button id="backup" class="secondary">バックアップを保存</button><label class="chip" style="cursor:pointer">バックアップを復元<input type="file" id="restore" accept=".json,application/json" hidden></label></div></details></footer>
<script>
const KEY='tsumiage_data_v4', names=['体調・気分','睡眠','食事','ワーク','生活タスク','運動','勉強'];
const $=id=>document.getElementById(id);const uid=()=>crypto.randomUUID();
let data;try{data=JSON.parse(localStorage.getItem(KEY))||{}}catch{data={}};data.tasks??=[];data.goals??=[];data.days??={};if(data.scoreSchema!==4){for(const e of Object.values(data.days))e.scores={};data.scoreSchema=4;for(const g of data.goals)g.progress??=0;for(const t of data.tasks)t.goalId='';localStorage.setItem(KEY,JSON.stringify(data))}
const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
$('day').value=iso(new Date());const today=()=>$('day').value;const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const text=(tag,s)=>{let el=document.createElement(tag);el.textContent=s;return el};
function redraw(){
const date=today();const tasks=data.tasks.filter(t=>t.date===date),done=tasks.filter(t=>t.done).length;
$('taskStatus').textContent=tasks.length?done+'/'+tasks.length+' 件完了（'+Math.round(done/tasks.length*100)+'%）':'まだTODOがありません';

$('taskList').replaceChildren();tasks.forEach(t=>{let row=text('div','');row.className='row';let cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;cb.onchange=()=>{t.done=cb.checked;save();redraw()};let label=text('label',t.name);if(t.done)label.style.textDecoration='line-through';let del=text('button','削除');del.className='danger';del.onclick=()=>{data.tasks=data.tasks.filter(x=>x.id!==t.id);save();redraw()};row.append(cb,label,del);$('taskList').append(row)});
$('goalList').replaceChildren();data.goals.forEach(g=>{let pct=Math.max(0,Math.min(100,Number(g.progress)||0));let wrap=document.createElement('div');wrap.style.marginTop='16px';let line=text('div','');line.className='flex';let name=document.createElement('input');name.type='text';name.value=g.name;name.title='目標名の変更';name.onchange=()=>{let s=name.value.trim();if(s){g.name=s;save()}else name.value=g.name};let progress=document.createElement('input');progress.type='number';progress.min=0;progress.max=100;progress.step=1;progress.value=pct;progress.style.width='75px';progress.title='進捗率を0〜100で入力';progress.onchange=()=>{let n=Number(progress.value);if(!Number.isFinite(n)||n<0||n>100){alert('0〜100の数字を入力してください');progress.value=g.progress||0;return}g.progress=Math.round(n);save();redraw()};let mark=text('span','%');let del=text('button','削除');del.className='danger';del.onclick=()=>{if(confirm('この長期目標を削除しますか？')){data.goals=data.goals.filter(x=>x.id!==g.id);save();redraw()}};line.append(name,progress,mark,del);let bar=text('div','');bar.className='bar';let fill=text('div','');fill.className='fill';fill.style.width=pct+'%';bar.append(fill);wrap.append(line,bar);$('goalList').append(wrap)});
let entry=data.days[date]||{};$('diary').value=entry.diary||'';$('metrics').replaceChildren();names.forEach((name,i)=>{let row=text('label','');row.className='metric';row.append(text('span',name));let sel=document.createElement('select');sel.add(new Option('未入力',''));for(let n=1;n<=10;n++)sel.add(new Option(n+'点',n));sel.value=entry.scores?.[i]??'';sel.style.background=sel.value?scoreColor(+sel.value):'';sel.onchange=()=>{let e=data.days[date]??={};e.scores??={};if(sel.value)e.scores[i]=Number(sel.value);else delete e.scores[i];sel.style.background=sel.value?scoreColor(+sel.value):'';save();average();drawChart()};row.append(sel);$('metrics').append(row)});
renderEvents();average();drawChart();
}
function average(){let e=data.days[today()]||{},v=Object.values(e.scores||{}).filter(n=>Number.isFinite(n));const value=v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1)+' / 10':'—';$('average').textContent=value;$('overviewScore').textContent=value;$('overviewProgress').textContent=v.length+' / 7項目入力済み'}
function scoreColor(n){return n<=3?'#ffd6d8':n<=7?'#d9f2ff':'#ddf5dd'}
const groups={all:[0,1,2,3,4,5,6],health:[0,1],work:[3],life:[2,4,5,6]};
function configureChart(){const mode=$('chartMode').value,sel=$('chartItem'),before=sel.value;sel.replaceChildren(new Option('グループ平均',''));for(const i of groups[mode])sel.add(new Option(names[i],String(i)));if([...sel.options].some(o=>o.value===before))sel.value=before;drawChart()}
function drawChart(){
const mode=$('chartMode').value,chosen=$('chartItem').value,idx=chosen!==''?[+chosen]:groups[mode];
const vals=[];for(let i=6;i>=0;i--){const d=new Date(today()+'T12:00:00');d.setDate(d.getDate()-i);const day=iso(d);const scores=data.days[day]?.scores||{};const n=idx.map(k=>scores[k]).filter(x=>Number.isFinite(x));vals.push({date:day.slice(5),value:n.length?n.reduce((a,b)=>a+b,0)/n.length:null})}
const width=680,height=200,left=34,right=12,top=13,bottom=29,inner=height-top-bottom;
const ns='http://www.w3.org/2000/svg';const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 '+width+' '+height);svg.setAttribute('role','img');svg.setAttribute('aria-label','直近7日間の評価推移');svg.style.width='100%';svg.style.maxHeight='260px';const add=(tag,attrs,textValue)=>{const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(textValue!==undefined)e.textContent=textValue;svg.append(e);return e};
const xx=i=>left+i*(width-left-right)/6,yy=v=>top+(10-v)/10*inner;
for(const v of [0,2,4,6,8,10]){let y=yy(v);add('line',{x1:left,y1:y,x2:width-right,y2:y,stroke:'#e0e7ef'});add('text',{x:4,y:y+4,'font-size':12,fill:'#64748b'},String(v))}
let path='';vals.forEach((v,i)=>{if(v.value===null){path='';return}const x=xx(i),y=yy(v.value);if(path){add('line',{x1:+path.split(',')[0],y1:+path.split(',')[1],x2:x,y2:y,stroke:'#327cc4','stroke-width':3})}path=x+','+y});
vals.forEach((v,i)=>{add('text',{x:xx(i),y:height-6,'text-anchor':'middle','font-size':11,fill:'#64748b'},v.date);if(v.value!==null){add('circle',{cx:xx(i),cy:yy(v.value),r:5,fill:'#327cc4'});add('text',{x:xx(i),y:yy(v.value)-11,'text-anchor':'middle','font-size':12,fill:'#203044'},v.value.toFixed(1))}});
$('chart').replaceChildren(svg);const note=text('div','※ 未入力の日は点を表示しません。平均は入力済み項目のみで計算。');note.className='muted';$('chart').append(note);
}
function renderEvents(){const e=data.days[today()]||{},items=[...(e.schedule||[])].sort((a,b)=>a.start.localeCompare(b.start));$('eventList').replaceChildren();if(!items.length){$('eventList').append(text('p','まだ記録がありません'));return}for(const event of items){const row=text('div','');row.className='row';const label=text('div',event.start+' 〜 '+event.end+'　'+event.title);label.style.flex='1';const del=text('button','削除');del.className='danger';del.onclick=()=>{e.schedule=e.schedule.filter(x=>x.id!==event.id);save();renderEvents()};row.append(label,del);$('eventList').append(row)}}
$('addEvent').onclick=()=>{const start=$('eventStart').value,end=$('eventEnd').value,title=$('eventText').value.trim();if(!start||!end||!title){alert('時刻と内容を入力してください');return}if(end<=start){alert('終了時刻は開始時刻より後にしてください');return}const e=data.days[today()]??={};e.schedule??=[];e.schedule.push({id:uid(),start,end,title});$('eventText').value='';save();renderEvents()};
$('chartMode').onchange=configureChart;$('chartItem').onchange=drawChart;
function shiftDay(n){const d=new Date(today()+'T12:00:00');if(Number.isNaN(d.getTime()))return;d.setDate(d.getDate()+n);$('day').value=iso(d);redraw()}$('prevDay').onclick=()=>shiftDay(-1);$('nextDay').onclick=()=>shiftDay(1);
$('day').onchange=redraw;$('diary').oninput=()=>{(data.days[today()]??={}).diary=$('diary').value;save()};
$('addTask').onclick=()=>{let name=$('task').value.trim();if(!name)return;data.tasks.push({id:uid(),date:today(),name,done:false,goalId:''});$('task').value='';save();redraw()};
$('addGoal').onclick=()=>{let name=$('goalName').value.trim();if(!name)return;data.goals.push({id:uid(),name,progress:0});$('goalName').value='';save();redraw()};
$('backup').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tsumiage-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('restore').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!Array.isArray(obj.tasks)||!Array.isArray(obj.goals)||typeof obj.days!=='object'||!obj.days)throw Error('形式が違います');if(confirm('現在のデータをバックアップデータで上書きしますか？')){data=obj;save();redraw()}}catch(err){alert('復元失敗: '+err.message)}e.target.value=''};
configureChart();redraw();
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
const endpoint='https://osqyecpjbolavsawweni.supabase.co',key='sb_publishable_MdrcWm98UjN3dOvM91zPfw_5n0Ptguw';
const sb=window.supabase?.createClient(endpoint,key);
const localKey='tsumiage_data_v4',backupKey='tsumiage_before_sync_backup',scorenames=['体調・気分','睡眠','食事','ワーク','生活タスク','運動','勉強'];
const headerSync=document.createElement('div');headerSync.className='flex';headerSync.style.justifyContent='flex-end';headerSync.style.alignItems='center';
headerSync.innerHTML='<button id="quickSync" class="secondary" type="button" disabled>同期</button><span id="syncstatus" class="muted" role="status">接続準備中…</span>';
document.querySelector('header').append(headerSync);
const account=document.createElement('section');account.className='card wide';account.innerHTML='<h2>アカウント設定</h2><div id="authui" class="flex"></div>';
const footer=document.querySelector('footer');footer.before(account);account.style.maxWidth='1100px';account.style.margin='16px auto';account.style.width='calc(100% - 32px)';
const ui=document.getElementById('authui'),quick=document.getElementById('quickSync'),status=s=>document.getElementById('syncstatus').textContent=s;
let user=null,working=false,last=null,ready=false;
const read=()=>{try{return JSON.parse(localStorage.getItem(localKey))||{tasks:[],goals:[],days:{}}}catch{return {tasks:[],goals:[],days:{}}}};
function migrateScores(d){d.days??={};if(d.scoreSchema!==4){for(const e of Object.values(d.days))e.scores={};d.scoreSchema=4;}d.goals??=[];for(const g of d.goals)g.progress??=0;d.tasks??=[];for(const t of d.tasks)t.goalId='';return d}
const meaningful=d=>(d.goals?.length||0)+(d.tasks?.length||0)+Object.keys(d.days||{}).length>0;
function normalize(d){
d.goals??=[];d.tasks??=[];d.days??={};
const m={};for(const g of d.goals){if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(g.id)){let old=g.id;g.id=crypto.randomUUID();m[old]=g.id}}
for(const t of d.tasks){if(m[t.goalId])t.goalId=m[t.goalId];if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(t.id))t.id=crypto.randomUUID()}
return d
}
function button(label,action,secondary=false){const b=document.createElement('button');b.textContent=label;if(secondary)b.className='secondary';b.onclick=action;return b}
function render(){
ui.replaceChildren();quick.disabled=!user;if(!sb){status('通信ライブラリを読み込めませんでした。ページを更新してください。');return}
if(!user){
const email=document.createElement('input');email.type='email';email.placeholder='メールアドレス';email.autocomplete='email';
const pwd=document.createElement('input');pwd.type='password';pwd.placeholder='パスワード';pwd.autocomplete='current-password';
ui.append(email,pwd);
ui.append(button('ログイン',async()=>{const {data,error}=await sb.auth.signInWithPassword({email:email.value,password:pwd.value});status(error?error.message:'ログインしました');if(data?.user)await start(data.user)}));
ui.append(button('新規登録',async()=>{const {error}=await sb.auth.signUp({email:email.value,password:pwd.value,options:{emailRedirectTo:location.origin+location.pathname}});status(error?error.message:'確認メールを確認してからログインしてください')} ,true));
}else{
ui.append(document.createTextNode(user.email+' '));

ui.append(button('クラウドから再取得',()=>initialLoad(true),true));
ui.append(button('ログアウト',async()=>{ready=false;await sb.auth.signOut();user=null;render();status('ログアウトしました')} ,true));
}
}
async function fetchAll(){
const data={};for(const t of ['goals','tasks','diary_entries','daily_scores']){
const {data:rows,error}=await sb.from(t).select('*').limit(10000);if(error)throw error;data[t]=rows||[];
}return data
}
function toLocal(rows){
const d={scoreSchema:4,goals:rows.goals.map(g=>({id:g.id,name:g.name,progress:g.progress_percent??0})),tasks:rows.tasks.map(t=>({id:t.id,date:t.task_date,name:t.name,done:t.completed,goalId:''})),days:{}};
for(const r of rows.diary_entries){const e=d.days[r.entry_date]??={};e.diary=r.content;e.schedule=Array.isArray(r.schedule)?r.schedule:[]}
for(const r of rows.daily_scores){const idx=scorenames.indexOf(r.category);if(idx<0)continue;const entry=d.days[r.entry_date]??={};entry.scores??={};entry.scores[idx]=r.score}
return d
}
function convert(d){
const user_id=user.id,goals=d.goals.map(g=>({id:g.id,user_id,name:g.name,target_count:1,progress_percent:Math.max(0,Math.min(100,Number(g.progress)||0))})),tasks=d.tasks.map(t=>({id:t.id,user_id,name:t.name,task_date:t.date,goal_id:null,completed:!!t.done})),diary=[],scores=[];
for(const [date,e] of Object.entries(d.days||{})){
if(typeof e.diary==='string'||Array.isArray(e.schedule))diary.push({user_id,entry_date:date,content:e.diary,schedule:Array.isArray(e.schedule)?e.schedule:[]});
for(const [idx,value] of Object.entries(e.scores||{}))if(scorenames[Number(idx)]&&Number(value)>=1&&Number(value)<=10)scores.push({user_id,entry_date:date,category:scorenames[Number(idx)],score:Number(value)})
}return {goals,tasks,diary_entries:diary,daily_scores:scores}
}
async function writeAll(d,cloudRows){
const vals=convert(d);
for(const table of ['goals','tasks','diary_entries','daily_scores']){
let rows=vals[table];if(rows.length){const conflict={goals:'id',tasks:'id',diary_entries:'user_id,entry_date',daily_scores:'user_id,entry_date,category'}[table];const {error}=await sb.from(table).upsert(rows,{onConflict:conflict});if(error)throw error}
}
const identifiers={goals:r=>r.id,tasks:r=>r.id,diary_entries:r=>r.entry_date,daily_scores:r=>r.entry_date+'|'+r.category};
for(const table of ['tasks','daily_scores','diary_entries','goals']){
const current=new Set(vals[table].map(identifiers[table]));
for(const old of cloudRows[table])if(!current.has(identifiers[table](old))){
let q=sb.from(table).delete().eq('user_id',user.id);
if(table==='goals'||table==='tasks')q=q.eq('id',old.id);
if(table==='diary_entries')q=q.eq('entry_date',old.entry_date);
if(table==='daily_scores')q=q.eq('entry_date',old.entry_date).eq('category',old.category);
const {error}=await q;if(error)throw error
}
}
}
async function initialLoad(force=false){
if(!user||working)return;working=true;ready=false;
try{
status('クラウドのデータを確認中…');
const rows=await fetchAll(),cloud=toLocal(rows),local=migrateScores(read());
if(meaningful(local)&&!meaningful(cloud)){
if(confirm('端末内の既存記録をクラウドへ移行しますか？（キャンセルすると端末の内容は保持したまま同期を開始しません）')){
localStorage.setItem(backupKey,JSON.stringify(local));
const normalized=normalize(local);await writeAll(normalized,rows);localStorage.setItem(localKey,JSON.stringify(normalized));last=JSON.stringify(normalized);ready=true;status('クラウドへ移行完了。画面を更新します。');location.reload();return
}else{status('既存記録を保護するため、同期は開始していません。');return}
}
if(meaningful(local)&&JSON.stringify(local)!==JSON.stringify(cloud)){
if(!force&&!confirm('クラウドの記録をこの端末に読み込みます。現在の端末データは別にバックアップします。続行しますか？')){status('同期を保留しました');return}
localStorage.setItem(backupKey,JSON.stringify(local))
}
const changed=JSON.stringify(local)!==JSON.stringify(cloud);
localStorage.setItem(localKey,JSON.stringify(cloud));last=JSON.stringify(cloud);ready=true;
status('クラウド同期が有効です。変更は自動保存されます。');
if(changed)location.reload()
}catch(e){status('同期エラー: '+e.message)}finally{working=false}
}
async function synchronize(manual=false){
if(!ready||working||!user)return false;
const raw=migrateScores(read()),serialized=JSON.stringify(raw);if(serialized===last){if(manual)status('最新の状態です');return true}
working=true;try{
status('クラウドへ保存中…');
const local=normalize(raw),rows=await fetchAll();await writeAll(local,rows);
localStorage.setItem(localKey,JSON.stringify(local));last=JSON.stringify(local);status('クラウドに保存しました');return true;
}catch(e){status('保存に失敗しました: '+e.message);return false}finally{working=false}
}
quick.onclick=async()=>{if(!user)return;const ok=await synchronize(true);if(ok!==false&&ready)await initialLoad(true)};
async function start(u){user=u;render();await initialLoad()}
render();status(sb?'未ログインの場合はメールアドレスで登録・ログインしてください。':'接続ライブラリの読込に失敗しました');
if(sb){sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){user=null;ready=false;render()}});sb.auth.getSession().then(({data,error})=>{if(error){render();status('認証状態の確認に失敗しました: '+error.message)}else if(data.session?.user)start(data.session.user);else{render();status('未ログインです。メールアドレスで新規登録またはログインしてください')}}).catch(e=>{render();status('認証確認エラー: '+e.message)})}
else render();
setInterval(()=>{if(ready)synchronize()},2500);
window.addEventListener('beforeunload',()=>{ /* save happens regularly while page remains open */ });
})();
